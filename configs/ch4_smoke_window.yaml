# Chapter 4 smoke window (docs/ch4_conditional_adaptation_plan.md, Phase 2).
#
# Coverage is lit samples present over lit minutes available in the clear-sky
# table, at min_ghi_clear = 0.001 kW/m^2.  The 7-day candidate 0615-0621 was the
# largest window clearing 80 % coverage at all three sites; the smoke was cut to
# its first 3 days by author decision (2026-09-22) to keep the run short.  The
# plan's original March-to-May preference has no solution here; see the plan's
# Section 5.1.
#
# The device measurements replay this same window, so it is a manifest, not a
# default: change it only with a recorded reason.
window:
  start_day: "0615"
  end_day: "0617"
  num_days: 3
min_ghi_clear: 0.001
samples_total: 7873
coverage:            # min_coverage is the worst single day in the window
  folsom: {samples: 2473, min_coverage: 0.919, mean_coverage: 0.950}
  karpicko: {samples: 2523, min_coverage: 0.829, mean_coverage: 0.868}
  poznan: {samples: 2877, min_coverage: 0.965, mean_coverage: 0.987}

# few-shot 7d fits on the first `fewshot_days` days and predicts on the rest
# (scripts/evaluate.py, evaluate_fewshot), so it cannot execute on a 3-day
# window at all.  It runs on this extended slice for the executability check
# only; its metrics are not comparable with the other smoke configurations.
fewshot_d7_exception:
  start_day: "0615"
  end_day: "0624"
  num_days: 10
  samples_total: 25976
  karpicko_min_coverage: 0.566

rejected:
  - window: "0509-0515"
    reason: "best window in March-May, but Karpicko coverage falls to 0.61"
  - window: "0121-0127"
    reason: >-
      0.918 worst-site coverage but only 10593 samples over 7 days; kept as the
      cold-season alternative
