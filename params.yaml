convert_timestamps:
  script_path: scripts/dvc/convert_timestamps.py
  output_path: data/folsom_prepared/images

clean_dataframe:
  script_path: scripts/dvc/clean_dataframe.py
  irradiance_path: data/folsom_raw/Folsom_irradiance.csv
  output_path: data/folsom_prepared/cleaned_irradiance.csv

export_periods:
  script_path: scripts/dvc/export_periods.py
  time_window: 15   # target forecasting horizon in minutes
  time_shift: 5     # minutes between history samples
  history_size: 4   # used history samples
  output_path: data/folsom_prepared/train_periods.pickle

train_forecaster:
  script_path: scripts/dvc/train_forecaster.py
  seed: 42

  #### MODE ####
  test_only: False

  restore_from_ckpt:

  #### MLflow ####
  mlflow:
    enabled: false
    tracking_uri: mlruns
    experiment_name: solar-irradiance-forecasting
    run_name:

  #### TRAINER ####
  trainer:
    devices: 1
    precision: bf16-mixed
    min_epochs: 10
    max_epochs: 30

  #### MODEL ####
  model:
    model_name: timm-resnet50
    pretrained: True
    compile: False
    loss_function: Berhu
    lr: 3e-4
    lr_patience: 2

  #### CALLBACKS ####
  callbacks:
    model_checkpoint:
      monitor: "val_loss" # name of the logged metric which determines when model is improving
      mode: "min" # can be "max" or "min"
      save_top_k: 1 # save k best models (determined by above metric)
      save_last: False # additionally, always save model from last epoch
      verbose: True
      dirpath: "checkpoints/"
      filename: "epoch_{epoch:03d}"
      auto_insert_metric_name: False
    early_stopping:
      monitor: "val_loss" # name of the logged metric which determines when model is improving
      mode: "min" # can be "max" or "min"
      patience: 5 # how many validation epochs of not improving until training stops
      min_delta: 0 # minimum change in the monitored metric needed to qualify as an improvement

  #### DATA ####
  datamodule:
    optical_flow: none  # none | farneback
    augment: True
    image_size: [ 128, 128 ]
    image_mean: [ 0.485, 0.456, 0.406 ]
    image_std: [ 0.229, 0.224, 0.225 ]
    batch_size: 64
    workers: 16
