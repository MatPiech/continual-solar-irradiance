vars:
  - data_raw: data/folsom_raw
  - data_prepared: data/folsom_prepared
  - data_eval: data/eval

stages:
  get_data:
    cmd: bash scripts/get_data.sh
    outs:
      - ${data_raw}/Folsom_irradiance.csv
      - ${data_raw}/images/:
          cache: false

  convert_timestamps:
    cmd: python ${convert_timestamps.script_path}
         --data-raw ${data_raw}
         --output-path ${convert_timestamps.output_path}
    deps:
      - ${data_raw}/images/
      - ${convert_timestamps.script_path}
    outs:
      - ${convert_timestamps.output_path}

  clean_dataframe:
    cmd: python ${clean_dataframe.script_path}
         --data-raw ${data_raw}
         --images-path ${convert_timestamps.output_path}
         --output-path ${clean_dataframe.output_path}
    deps:
      - ${data_raw}/Folsom_irradiance.csv
      - ${convert_timestamps.output_path}
      - ${clean_dataframe.script_path}
    outs:
      - ${clean_dataframe.output_path}

  export_periods:
    cmd: python ${export_periods.script_path}
         --cleaned-dataframe-path ${clean_dataframe.output_path}
         --time-window ${export_periods.time_window}
         --time-shift ${export_periods.time_shift}
         --history-size ${export_periods.history_size}
         --output-path ${export_periods.output_path}
    deps:
      - ${export_periods.script_path}
      - ${clean_dataframe.output_path}
    params:
      - export_periods.time_window
      - export_periods.time_shift
      - export_periods.history_size
    outs:
      - ${export_periods.output_path}
